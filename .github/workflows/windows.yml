# Builds the standalone Windows version (no Python needed) on GitHub's Windows machines.
# On a published release: the zip is attached to the release. By hand (Actions tab, "Run workflow"): the zip
# is kept as a downloadable artifact of the run.
# The game is never involved: the tests that need an ISO are skipped here.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-build.txt pytest
      - name: Tests (without ISO)
        run: python -m pytest -q
      - name: Build the executable
        run: pyinstaller --onefile --windowed --name DDS1-Randomizer --paths . packaging/launcher.py
      - name: Package
        shell: pwsh
        run: |
          $version = python -c "import randomizer; print(randomizer.__version__)"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/DDS1-Randomizer.exe, README.md, LICENSE package/
          Copy-Item -Recurse presets package/presets
          Compress-Archive -Path package/* -DestinationPath "DDS1-Randomizer-$version-windows.zip"
          "ZIP=DDS1-Randomizer-$version-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP }}" --clobber
      - name: Keep as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ZIP }}
